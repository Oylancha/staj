<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün Detayı | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .item-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-top: 2rem;
      align-items: center;
    }
    @media (max-width: 768px) {
      .item-detail-container {
        grid-template-columns: 1fr;
      }
    }
    .item-img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .item-title {
      font-size: 2.5rem;
      color: var(--text-main);
      margin-bottom: 1rem;
    }
    .item-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <nav class="navbar animate-fade-in">
    <div class="logo-container">
      <a href="index.html" class="logo-text">İkies Elektronik</a>
    </div>
    <button class="menu-toggle">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Anasayfa</a></li>
      <li><a href="about.html">Hakkımızda</a></li>
      <li><a href="projects.html">Ürünler & Projeler</a></li>
      <li><a href="references.html">Referanslar</a></li>
      <li><a href="contact.html">İletişim</a></li>
      <li><a href="cart.html" class="cart-nav-link">Sepet <span id="cart-badge" style="display:none;">0</span></a></li>
    </ul>
  </nav>

  <div class="container animate-fade-in delay-100">
    <div id="item-container" class="item-detail-container">
      <p style="color: var(--text-muted);">Ürün yükleniyor...</p>
    </div>
  </div>

  <footer style="text-align: center; padding: 2rem 0; border-top: 1px solid var(--border-color); margin-top: 4rem;">
    <p style="color: var(--text-muted);">&copy; 2024 İkies Elektronik. Tüm hakları saklıdır.</p>
  </footer>

  <script src="js/app.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const container = document.getElementById('item-container');
      
      try {
        const res = await fetch(`/api/products/${id}`);
        if (!res.ok) throw new Error('Not found');
        const product = await res.json();
        
        document.title = `${product.name} | İkies Elektronik`;

        const manualButtonHtml = product.manual_url 
          ? `<a href="${product.manual_url}" download class="btn" style="background: var(--text-muted); color: #111;">Teknik Kılavuzu İndir</a>` 
          : '';

        container.innerHTML = `
          <img src="${product.image_url}" alt="${product.name}" class="item-img" onerror="this.src='images/placeholder.jpg'">
          <div>
            <h1 class="item-title">${product.name}</h1>
            <p class="item-desc">${product.description}</p>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
              <input type="number" id="qty-input" value="1" min="1" style="width: 80px; padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border-color); background: #111; color: #fff;">
              <button class="btn" onclick="window.cart.addItem('${product.name}', document.getElementById('qty-input').value)">Sepete Ekle</button>
              ${manualButtonHtml}
            </div>
          </div>
        `;
      } catch(e) {
        container.innerHTML = '<p style="color: var(--accent-red);">Ürün bulunamadı.</p>';
      }
    });
  </script>
</body>
</html>
