<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Paneli | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .admin-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 3rem;
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 5%;
    }
    
    .panel-section {
      background-color: var(--bg-card);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    
    .panel-section h2 {
      color: var(--accent-red);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .form-group label {
      font-weight: 500;
    }
    
    .form-group input, .form-group textarea, .form-group select {
      padding: 0.75rem;
      background-color: #111;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-family: var(--font-family);
    }
    
    /* CSS Tree Styling */
    .tree ul {
      padding-top: 20px; position: relative;
      transition: all 0.5s;
      -webkit-transition: all 0.5s;
      -moz-transition: all 0.5s;
      display: flex;
      justify-content: center;
    }
    
    .tree li {
      float: left; text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 5px 0 5px;
      transition: all 0.5s;
      -webkit-transition: all 0.5s;
      -moz-transition: all 0.5s;
    }
    
    /* We will use ::before and ::after to draw the connectors */
    .tree li::before, .tree li::after {
      content: '';
      position: absolute; top: 0; right: 50%;
      border-top: 1px solid var(--border-color);
      width: 50%; height: 20px;
    }
    .tree li::after {
      right: auto; left: 50%;
      border-left: 1px solid var(--border-color);
    }
    
    /* We need to remove left-right connectors from elements without any siblings */
    .tree li:only-child::after, .tree li:only-child::before {
      display: none;
    }
    
    /* Remove space from the top of single children */
    .tree li:only-child { padding-top: 0;}
    
    /* Remove left connector from first child and right connector from last child */
    .tree li:first-child::before, .tree li:last-child::after {
      border: 0 none;
    }
    /* Adding back the vertical connector to the last nodes */
    .tree li:last-child::before {
      border-right: 1px solid var(--border-color);
      border-radius: 0 5px 0 0;
    }
    .tree li:first-child::after {
      border-radius: 5px 0 0 0;
    }
    
    /* Time to add downward connectors from parents */
    .tree ul ul::before {
      content: '';
      position: absolute; top: 0; left: 50%;
      border-left: 1px solid var(--border-color);
      width: 0; height: 20px;
    }
    
    .tree li a {
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      text-decoration: none;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 14px;
      display: inline-block;
      border-radius: 5px;
      transition: all 0.5s;
      background-color: #111;
    }
    
    .tree li a:hover, .tree li a:hover+ul li a {
      background: var(--accent-red); color: #fff; border: 1px solid var(--accent-red);
    }
    .tree li a:hover+ul li::after, 
    .tree li a:hover+ul li::before, 
    .tree li a:hover+ul::before, 
    .tree li a:hover+ul ul::before {
      border-color:  var(--accent-red);
    }
    
    @media (max-width: 900px) {
      .admin-container {
        grid-template-columns: 1fr;
      }
      .tree ul { flex-direction: column; align-items: center; }
      .tree li::before, .tree li::after, .tree ul ul::before { display: none; }
      .tree li { padding: 10px; }
    }
    
    .tree-node {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .delete-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  
  <nav class="navbar">
    <div class="logo-container">
      <span class="logo-text">İkies Elektronik | Admin</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Siteye Dön</a></li>
      <li><a href="#" id="logout-btn" style="color: var(--accent-red);">Çıkış Yap</a></li>
    </ul>
  </nav>

  <div class="admin-container animate-fade-in delay-100">
    
    <div class="panel-section">
      <h2>Yeni Ürün Ekle</h2>
      <form id="add-product-form">
        <div class="form-group">
          <label for="p_name">Ürün Adı</label>
          <input type="text" id="p_name" required>
        </div>
        <div class="form-group">
          <label for="p_desc">Açıklama</label>
          <textarea id="p_desc" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="p_image">Ürün Resmi Yükle</label>
          <input type="file" id="p_image" accept="image/*" style="background: transparent; border: none; padding: 0;">
        </div>
        <div class="form-group">
          <label for="p_manual">Teknik Kılavuz Yükle (PDF/DOC) (İsteğe Bağlı)</label>
          <input type="file" id="p_manual" accept=".pdf,.doc,.docx" style="background: transparent; border: none; padding: 0;">
        </div>
        <div class="form-group">
          <label for="p_parent">Bağlı Olduğu Sistem (Parent)</label>
          <select id="p_parent">
            <option value="">Bağımsız (Ana Ürün)</option>
            <!-- Options populated dynamically -->
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Ürünü Ekle</button>
      </form>
    </div>

    <div class="panel-section" style="overflow-x: auto;">
      <h2>Ürün Hiyerarşisi (Branch System)</h2>
      <div class="tree" id="tree-container">
        <!-- Tree rendered via JS -->
      </div>
    </div>

  </div>

  <script>
    // Secure routing
    const token = localStorage.getItem('admin_token');
    if (!token) {
      window.location.href = 'admin-login.html';
    }

    // Logout
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('admin_token');
      window.location.href = 'admin-login.html';
    });

    let allProducts = [];

    // Fetch and render
    async function fetchProducts() {
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          allProducts = await res.json();
          updateParentDropdown();
          renderTree();
        } else if (res.status === 401) {
          localStorage.removeItem('admin_token');
          window.location.href = 'admin-login.html';
        }
      } catch (e) {
        console.error("API connection failed:", e);
      }
    }

    function updateParentDropdown() {
      const select = document.getElementById('p_parent');
      select.innerHTML = '<option value="">Bağımsız (Ana Ürün)</option>';
      allProducts.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      });
    }

    function buildTreeHTML(parentId) {
      const children = allProducts.filter(p => p.parent_id === parentId);
      if (children.length === 0) return '';
      
      let html = '<ul>';
      children.forEach(child => {
        html += `<li>
          <div class="tree-node">
            <a href="item.html?id=${child.id}" target="_blank">${child.name}</a>
            <button class="delete-btn" onclick="deleteProduct(${child.id}, event)">X</button>
          </div>`;
        html += buildTreeHTML(child.id);
        html += `</li>`;
      });
      html += '</ul>';
      return html;
    }

    async function deleteProduct(id, e) {
      if (e) e.preventDefault();
      if (!confirm('Bu öğeyi silmek istediğinize emin misiniz? Alt öğeler de silinebilir veya ayrılabilir.')) return;
      try {
        const res = await fetch(`/api/products/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          fetchProducts();
        } else {
          alert('Silme işlemi başarısız.');
        }
      } catch (err) {
        alert('Sunucu hatası.');
      }
    }

    function renderTree() {
      const container = document.getElementById('tree-container');
      const html = buildTreeHTML(null);
      container.innerHTML = html || '<p style="color:var(--text-muted);">Henüz ürün eklenmedi.</p>';
    }

    // Add Product
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('p_image');
      const manualInput = document.getElementById('p_manual');
      let finalImageUrl = "";
      let finalManualUrl = null;

      if (fileInput.files.length > 0) {
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        
        try {
          const uploadRes = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          if (uploadRes.ok) {
            const data = await uploadRes.json();
            finalImageUrl = data.url;
          } else {
            alert("Resim yüklenirken hata oluştu.");
            return;
          }
        } catch (err) {
          alert("Resim yükleme servisine ulaşılamadı.");
          return;
        }
      }

      if (manualInput.files.length > 0) {
        const formData = new FormData();
        formData.append("file", manualInput.files[0]);
        try {
          const uploadRes = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          if (uploadRes.ok) {
            const data = await uploadRes.json();
            finalManualUrl = data.url;
          } else {
            alert("Kılavuz yüklenirken hata oluştu.");
            return;
          }
        } catch (err) {
          alert("Kılavuz yükleme servisine ulaşılamadı.");
          return;
        }
      }
      
      const payload = {
        name: document.getElementById('p_name').value,
        description: document.getElementById('p_desc').value,
        image_url: finalImageUrl,
        manual_url: finalManualUrl,
        parent_id: document.getElementById('p_parent').value ? parseInt(document.getElementById('p_parent').value) : null
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` // Simplified token passing
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("Ürün başarıyla eklendi!");
          document.getElementById('add-product-form').reset();
          fetchProducts();
        } else {
          alert("Ürün eklenirken hata oluştu.");
        }
      } catch (err) {
        alert("Sunucu bağlantı hatası.");
      }
    });

    // Init
    fetchProducts();
  </script>
</body>
</html>
