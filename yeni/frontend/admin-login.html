<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Girişi | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-dark);
    }
    .login-container {
      background-color: var(--bg-card);
      padding: 3rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-container h1 {
      color: var(--accent-red);
      margin-bottom: 2rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .form-group label {
      font-weight: 500;
    }
    .form-group input {
      padding: 0.75rem;
      background-color: #111;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-family: var(--font-family);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent-red);
    }
    .error-msg {
      color: var(--accent-red);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  
  <div class="login-container animate-fade-in">
    <div class="logo-container" style="justify-content: center; margin-bottom: 1rem;">
      <span class="logo-text">İkies Elektronik</span>
    </div>
    <h1>Yönetici Paneli</h1>
    
    <div class="error-msg" id="error-msg">Geçersiz kullanıcı adı veya şifre.</div>
    <div id="success-msg" style="color: #4ade80; font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;" id="login-btn">Giriş Yap</button>
      <button type="button" class="btn" id="show-change-pw-btn" style="width: 100%; margin-top: 0.75rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);">Şifre Değiştir</button>
    </form>

    <!-- Change Password Form -->
    <form id="change-pw-form" style="display: none;">
      <h3 style="color: var(--text-main); font-size: 1.1rem; margin-bottom: 1rem;">Şifre Değiştir</h3>
      <div class="form-group">
        <label for="cp_username">Kullanıcı Adı</label>
        <input type="text" id="cp_username" required value="admin" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="cp_current">Mevcut Şifre (Zorunlu)</label>
        <input type="password" id="cp_current" required placeholder="Mevcut şifrenizi giriniz">
      </div>
      <div class="form-group">
        <label for="cp_new">Yeni Şifre</label>
        <input type="password" id="cp_new" required placeholder="En az 4 karakter">
      </div>
      <div class="form-group">
        <label for="cp_confirm">Yeni Şifreyi Onayla</label>
        <input type="password" id="cp_confirm" required placeholder="Yeni şifrenizi tekrar giriniz">
      </div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;" id="change-pw-btn">Şifreyi Güncelle</button>
      <button type="button" class="btn" id="cancel-change-pw-btn" style="width: 100%; margin-top: 0.75rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);">← Giriş Ekranına Dön</button>
    </form>

    <a href="index.html" style="display: block; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">← Anasayfaya Dön</a>
  </div>

  <script>
    if (localStorage.getItem('admin_token')) {
      window.location.href = 'admin-panel.html';
    }

    const loginForm = document.getElementById('login-form');
    const changePwForm = document.getElementById('change-pw-form');
    const showChangePwBtn = document.getElementById('show-change-pw-btn');
    const cancelChangePwBtn = document.getElementById('cancel-change-pw-btn');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function clearMsgs() {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
    }

    showChangePwBtn.addEventListener('click', () => {
      loginForm.style.display = 'none';
      changePwForm.style.display = 'block';
      clearMsgs();
    });

    cancelChangePwBtn.addEventListener('click', () => {
      changePwForm.style.display = 'none';
      loginForm.style.display = 'block';
      clearMsgs();
    });

    // Candidate auth endpoints (direct PHP file avoids mod_rewrite / .htaccess 404s on cPanel)
    async function sendAuthRequest(action, payload) {
      const candidateUrls = [
        `backend_php/api.php?request=${action}`,
        `/backend_php/api.php?request=${action}`,
        `../backend_php/api.php?request=${action}`,
        `/api/${action}`,
        `api/${action}`
      ];

      for (const url of candidateUrls) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.status === 404 || res.status === 405) {
            continue;
          }
          return res;
        } catch (err) {
          // Network error or timeout, continue to next candidate
        }
      }
      return null;
    }

    // Login Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('login-btn');
      
      btn.textContent = "Lütfen bekleyin...";
      btn.disabled = true;
      clearMsgs();

      try {
        let res = await sendAuthRequest('login', { username, password });

        if (res && res.ok) {
          const data = await res.json();
          localStorage.setItem('admin_token', data.access_token);
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('offline_admin_pw', password);
          window.location.href = 'admin-panel.html';
          return;
        }

        // If the live server rejected with 400, it's possible the server database is still on 'admin123'
        // or a previously stored offline password, while the user is logging in with their updated password.
        if (res && res.status === 400 && password !== 'admin123') {
          // 1. Try syncing server from 'admin123' to the entered password
          try {
            const syncRes = await sendAuthRequest('change-password', {
              username: username,
              current_password: 'admin123',
              new_password: password
            });
            if (syncRes && syncRes.ok) {
              const retryRes = await sendAuthRequest('login', { username, password });
              if (retryRes && retryRes.ok) {
                const retryData = await retryRes.json();
                localStorage.setItem('admin_token', retryData.access_token);
                localStorage.setItem('token', retryData.access_token);
                localStorage.setItem('offline_admin_pw', password);
                window.location.href = 'admin-panel.html';
                return;
              }
            }
          } catch (_) {}

          // 2. Try syncing server from stored offline password (if different)
          const storedOfflinePw = localStorage.getItem('offline_admin_pw');
          if (storedOfflinePw && storedOfflinePw !== 'admin123' && storedOfflinePw !== password) {
            try {
              const syncRes2 = await sendAuthRequest('change-password', {
                username: username,
                current_password: storedOfflinePw,
                new_password: password
              });
              if (syncRes2 && syncRes2.ok) {
                const retryRes2 = await sendAuthRequest('login', { username, password });
                if (retryRes2 && retryRes2.ok) {
                  const retryData2 = await retryRes2.json();
                  localStorage.setItem('admin_token', retryData2.access_token);
                  localStorage.setItem('token', retryData2.access_token);
                  localStorage.setItem('offline_admin_pw', password);
                  window.location.href = 'admin-panel.html';
                  return;
                }
              }
            } catch (_) {}
          }
        }

        if (res) {
          showError("Geçersiz kullanıcı adı veya şifre.");
          btn.textContent = "Giriş Yap";
          btn.disabled = false;
          return;
        }

        // Offline / local file fallback
        const offlinePw = localStorage.getItem('offline_admin_pw') || 'admin123';
        if (username === 'admin' && (password === offlinePw || password === 'admin123')) {
          localStorage.setItem('offline_admin_pw', password);
          const mockToken = 'offline_token_' + Date.now();
          localStorage.setItem('admin_token', mockToken);
          localStorage.setItem('token', mockToken);
          window.location.href = 'admin-panel.html';
          return;
        } else {
          showError("Geçersiz kullanıcı adı veya şifre.");
          btn.textContent = "Giriş Yap";
          btn.disabled = false;
        }
      } catch (err) {
        showError("Bağlantı hatası oluştu. Lütfen tekrar deneyin.");
        btn.textContent = "Giriş Yap";
        btn.disabled = false;
      }
    });

    // Change Password Submission
    changePwForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('cp_username').value.trim();
      const currentPassword = document.getElementById('cp_current').value.trim();
      const newPassword = document.getElementById('cp_new').value.trim();
      const confirmPassword = document.getElementById('cp_confirm').value.trim();
      const btn = document.getElementById('change-pw-btn');

      clearMsgs();

      if (newPassword !== confirmPassword) {
        showError("Yeni şifreler eşleşmiyor.");
        return;
      }

      if (newPassword.length < 4) {
        showError("Yeni şifre en az 4 karakter olmalıdır.");
        return;
      }

      btn.textContent = "Şifre güncelleniyor...";
      btn.disabled = true;

      try {
        let res = await sendAuthRequest('change-password', {
          username: username,
          current_password: currentPassword,
          new_password: newPassword
        });

        // If server rejected current password, but the server is still on 'admin123'
        // and the user entered their local offline password as currentPassword:
        if (res && res.status === 400 && currentPassword !== 'admin123') {
          try {
            const fallbackRes = await sendAuthRequest('change-password', {
              username: username,
              current_password: 'admin123',
              new_password: newPassword
            });
            if (fallbackRes && fallbackRes.ok) {
              res = fallbackRes;
            }
          } catch (_) {}
        }

        if (res && res.ok) {
          localStorage.setItem('offline_admin_pw', newPassword);
          showSuccess("Şifreniz başarıyla güncellendi! Yeni şifrenizle giriş yapabilirsiniz.");
          changePwForm.reset();
          changePwForm.style.display = 'none';
          loginForm.style.display = 'block';
          return;
        }

        if (res) {
          let errorText = "Mevcut şifre hatalı.";
          try {
            const data = await res.json();
            if (data && data.detail) {
              if (data.detail.includes("Mevcut şifre") || data.detail.toLowerCase().includes("current password")) {
                errorText = "Mevcut şifre hatalı.";
              } else {
                errorText = data.detail;
              }
            }
          } catch (_) {}
          showError(errorText);
          return;
        }

        // Offline / local fallback - requires matching current password or admin123
        const offlinePw = localStorage.getItem('offline_admin_pw') || 'admin123';
        if (username === 'admin' && (currentPassword === offlinePw || currentPassword === 'admin123')) {
          localStorage.setItem('offline_admin_pw', newPassword);
          showSuccess("Şifreniz başarıyla güncellendi! Yeni şifrenizle giriş yapabilirsiniz.");
          changePwForm.reset();
          changePwForm.style.display = 'none';
          loginForm.style.display = 'block';
        } else {
          showError("Mevcut şifre hatalı.");
        }
      } catch (err) {
        showError("Şifre güncellenirken bir hata oluştu.");
      } finally {
        btn.textContent = "Şifreyi Güncelle";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
