<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Girişi | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css?v=3" />
  <link rel="stylesheet" href="css/components.css?v=4" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('ikies_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse 70% 50% at 50% 10%, rgba(230, 57, 70, 0.08), transparent), hsl(var(--background));
      padding: 1.5rem 1rem;
    }

    .login-card {
      background-color: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius-xl);
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px hsl(var(--border));
      position: relative;
    }

    [data-theme="light"] .login-card {
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.1), 0 0 0 1px hsl(var(--border));
    }

    .theme-toggle-corner {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
    }

    .error-msg {
      background-color: hsla(var(--destructive), 0.12);
      border: 1px solid hsla(var(--destructive), 0.3);
      color: hsl(0, 85%, 65%);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .success-msg {
      background-color: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding-top: max(2rem, env(safe-area-inset-top));
      }
      .login-card {
        padding: 2rem 1.25rem;
        border-radius: var(--radius);
      }
      .input {
        min-height: 44px;
        font-size: 1rem;
      }
      .btn {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  
  <div class="login-card animate-fade-in">
    <button class="theme-toggle-btn theme-toggle-corner" aria-label="Temayı Değiştir" title="Açık/Koyu Tema">
      <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="logo-text" style="display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; text-decoration: none;">
        <img src="images/logo.png" alt="İkies Elektronik Logo" class="logo-img">
        <span>İkies Elektronik</span>
      </a>
      <h1 class="tracking-tight" style="font-size: 1.65rem; font-weight: 700; margin-bottom: 0.35rem;">Yönetici Girişi</h1>
      <p class="text-muted" style="font-size: 0.875rem;">Yönetim paneline erişmek için bilgilerinizi girin</p>
    </div>
    
    <div class="error-msg" id="error-msg">Geçersiz kullanıcı adı veya şifre.</div>
    <div class="success-msg" id="success-msg"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="label" for="username">Kullanıcı Adı</label>
        <input type="text" id="username" class="input" required value="admin" placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="label" for="password">Şifre</label>
        <input type="password" id="password" class="input" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; height: 2.5rem;" id="login-btn">Giriş Yap</button>
      <button type="button" class="btn btn-outline" id="show-change-pw-btn" style="width: 100%; height: 2.5rem; margin-top: 0.75rem;">Şifre Değiştir</button>
    </form>

    <!-- Change Password Form -->
    <form id="change-pw-form" style="display: none;">
      <h3 class="tracking-tight" style="color: hsl(var(--card-foreground)); font-size: 1.15rem; font-weight: 600; margin-bottom: 1rem;">Şifreyi Güncelle</h3>
      <div class="form-group">
        <label class="label" for="cp_username">Kullanıcı Adı</label>
        <input type="text" id="cp_username" class="input" required value="admin" placeholder="admin">
      </div>
      <div class="form-group">
        <label class="label" for="cp_current">Mevcut Şifre</label>
        <input type="password" id="cp_current" class="input" required placeholder="Mevcut şifrenizi giriniz">
      </div>
      <div class="form-group">
        <label class="label" for="cp_new">Yeni Şifre</label>
        <input type="password" id="cp_new" class="input" required placeholder="En az 4 karakter">
      </div>
      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="label" for="cp_confirm">Yeni Şifreyi Onayla</label>
        <input type="password" id="cp_confirm" class="input" required placeholder="Yeni şifrenizi tekrar giriniz">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; height: 2.5rem;" id="change-pw-btn">Şifreyi Güncelle</button>
      <button type="button" class="btn btn-outline" id="cancel-change-pw-btn" style="width: 100%; height: 2.5rem; margin-top: 0.75rem;">← Giriş Ekranına Dön</button>
    </form>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html" class="text-muted" style="font-size: 0.85rem; text-decoration: none; transition: color 0.15s ease;" onmouseover="this.style.color='hsl(var(--foreground))'" onmouseout="this.style.color='hsl(var(--muted-foreground))'">
        ← Anasayfaya Dön
      </a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('admin_token')) {
      window.location.href = 'admin-panel.html';
    }

    const loginForm = document.getElementById('login-form');
    const changePwForm = document.getElementById('change-pw-form');
    const showChangePwBtn = document.getElementById('show-change-pw-btn');
    const cancelChangePwBtn = document.getElementById('cancel-change-pw-btn');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function clearMsgs() {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
    }

    showChangePwBtn.addEventListener('click', () => {
      loginForm.style.display = 'none';
      changePwForm.style.display = 'block';
      clearMsgs();
    });

    cancelChangePwBtn.addEventListener('click', () => {
      changePwForm.style.display = 'none';
      loginForm.style.display = 'block';
      clearMsgs();
    });

    // Candidate auth endpoints (direct PHP file avoids mod_rewrite / .htaccess 404s on cPanel)
    async function sendAuthRequest(action, payload) {
      const isFrontendSubdir = typeof window !== 'undefined' && window.location.pathname.includes('/frontend');
      const candidateUrls = isFrontendSubdir ? [
        `../backend_php/api.php?request=${action}`,
        `/backend_php/api.php?request=${action}`,
        `backend_php/api.php?request=${action}`,
        `../api.php?request=${action}`,
        `api.php?request=${action}`,
        `/api/${action}`,
        `api/${action}`
      ] : [
        `backend_php/api.php?request=${action}`,
        `/backend_php/api.php?request=${action}`,
        `../backend_php/api.php?request=${action}`,
        `api.php?request=${action}`,
        `api/api.php?request=${action}`,
        `/api/${action}`,
        `api/${action}`
      ];

      for (const url of candidateUrls) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.status === 404 || res.status === 405) {
            continue;
          }
          return res;
        } catch (err) {
          // Network error or timeout, continue to next candidate
        }
      }
      return null;
    }

    // Login Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('login-btn');
      
      btn.textContent = "Lütfen bekleyin...";
      btn.disabled = true;
      clearMsgs();

      try {
        let res = await sendAuthRequest('login', { username, password });

        if (res && res.ok) {
          const data = await res.json();
          localStorage.setItem('admin_token', data.access_token);
          localStorage.setItem('token', data.access_token);
          window.location.href = 'admin-panel.html';
          return;
        }

        if (res) {
          let errorText = "Geçersiz kullanıcı adı veya şifre.";
          if (res.status === 508) {
            errorText = "Sunucu Kaynak Limiti Aşıldı (Hata 508: Insufficient Resource). PHP süreçleri kilitlendiği veya yoğunluk oluştuğu için sunucu yanıt veremiyor. Şifreniz yanlış DEĞİLDİR. Lütfen cPanel'den PHP sürümünü değiştirip geri alarak süreçleri sıfırlayın veya 2-3 dakika bekleyin.";
          } else if (res.status === 503) {
            errorText = "Sunucu Geçici Olarak Meşgul (Hata 503: Service Unavailable). LiteSpeed PHP süreç limiti doldu. Şifreniz yanlış DEĞİLDİR. Lütfen birkaç dakika bekleyin veya cPanel'den süreçleri sıfırlayın.";
          } else if (res.status >= 500) {
            errorText = `Sunucu hatası (${res.status}). Sunucu şu anda isteği işleyemiyor, şifrenizle ilgili bir sorun yoktur.`;
          } else {
            try {
              const data = await res.json();
              if (data && data.detail) {
                errorText = data.detail;
              }
            } catch (_) {}
          }
          showError(errorText);
          btn.textContent = "Giriş Yap";
          btn.disabled = false;
          return;
        }

        // Offline fallback only for local file:// testing
        if (window.location.protocol === 'file:') {
          if (username === 'admin' && password === 'Serdar1') {
            const mockToken = 'offline_token_' + Date.now();
            localStorage.setItem('admin_token', mockToken);
            localStorage.setItem('token', mockToken);
            window.location.href = 'admin-panel.html';
            return;
          } else {
            showError("Geçersiz kullanıcı adı veya şifre.");
          }
        } else {
          showError("Sunucuya bağlanılamadı. Lütfen backend_php klasörünü ve sunucu durumunu kontrol edin.");
        }
        btn.textContent = "Giriş Yap";
        btn.disabled = false;
      } catch (err) {
        showError("Bağlantı hatası oluştu. Lütfen tekrar deneyin.");
        btn.textContent = "Giriş Yap";
        btn.disabled = false;
      }
    });

    // Change Password Submission
    changePwForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('cp_username').value.trim();
      const currentPassword = document.getElementById('cp_current').value.trim();
      const newPassword = document.getElementById('cp_new').value.trim();
      const confirmPassword = document.getElementById('cp_confirm').value.trim();
      const btn = document.getElementById('change-pw-btn');

      clearMsgs();

      if (newPassword !== confirmPassword) {
        showError("Yeni şifreler eşleşmiyor.");
        return;
      }

      if (newPassword.length < 4) {
        showError("Yeni şifre en az 4 karakter olmalıdır.");
        return;
      }

      btn.textContent = "Şifre güncelleniyor...";
      btn.disabled = true;

      try {
        let res = await sendAuthRequest('change-password', {
          username: username,
          current_password: currentPassword,
          new_password: newPassword
        });

        if (res && res.ok) {
          showSuccess("Şifreniz başarıyla güncellendi! Yeni şifrenizle giriş yapabilirsiniz.");
          changePwForm.reset();
          changePwForm.style.display = 'none';
          loginForm.style.display = 'block';
          document.getElementById('username').value = username;
          document.getElementById('password').value = '';
          return;
        }

        if (res) {
          let errorText = "Mevcut şifre hatalı.";
          if (res.status === 508) {
            errorText = "Sunucu Kaynak Limiti Aşıldı (Hata 508). Sunucu meşgul olduğu için işlem yapılamıyor. Şifreniz yanlış DEĞİLDİR.";
          } else if (res.status === 503) {
            errorText = "Sunucu Meşgul (Hata 503). LiteSpeed PHP süreç limiti doldu.";
          } else if (res.status >= 500) {
            errorText = `Sunucu hatası (${res.status}).`;
          } else {
            try {
              const data = await res.json();
              if (data && data.detail) {
                errorText = data.detail;
              }
            } catch (_) {}
          }
          showError(errorText);
          return;
        }

        if (window.location.protocol === 'file:') {
          if (username === 'admin' && currentPassword === 'Serdar1') {
            showSuccess("Şifreniz başarıyla güncellendi (Offline mod).");
            changePwForm.reset();
            changePwForm.style.display = 'none';
            loginForm.style.display = 'block';
          } else {
            showError("Mevcut şifre hatalı.");
          }
        } else {
          showError("Sunucuya bağlanılamadı. Lütfen sunucu durumunu kontrol edin.");
        }
      } catch (err) {
        showError("Şifre güncellenirken bir hata oluştu.");
      } finally {
        btn.textContent = "Şifreyi Güncelle";
        btn.disabled = false;
      }
    });
  </script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
