<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetim | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--bg-card);
      padding: 2rem;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      border: 1px solid var(--border-color);
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none; border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-light);
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: inherit;
      box-sizing: border-box;
    }
    .anti-spam-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      background: rgba(220, 38, 38, 0.1);
      padding: 1rem;
      border-radius: 4px;
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
  </style>
</head>
<body>
  <nav class="navbar animate-fade-in">
    <div class="logo-container">
      <a href="index.html" class="logo-text">İkies Elektronik</a>
    </div>
    <button class="menu-toggle">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Anasayfa</a></li>
      <li><a href="about.html">Hakkımızda</a></li>
      <li><a href="projects.html">Ürünler & Projeler</a></li>
      <li><a href="references.html">Referanslar</a></li>
      <li><a href="contact.html">İletişim</a></li>
      <li><a href="cart.html" class="cart-nav-link" style="color: var(--accent-red);">Sepet <span id="cart-badge" style="display:none;">0</span></a></li>
    </ul>
  </nav>

  <div class="container animate-fade-in delay-100">
    <h1 style="font-size: 2.5rem; color: var(--accent-red); margin-bottom: 2rem;">Alışveriş Sepetim</h1>
    <div id="cart-items-container">
      <p style="color: var(--text-muted);">Sepetiniz boş.</p>
    </div>
    <div style="margin-top: 2rem;">
      <button class="btn" onclick="window.cart.clearCart()">Sepeti Boşalt</button>
      <button id="complete-order-btn" class="btn" style="background: var(--text-muted); color: #111; margin-left: 1rem;" onclick="openCheckoutModal()">Siparişi Tamamla</button>
    </div>
  </div>

  <div id="checkout-modal" class="modal-overlay">
    <div class="modal-content animate-fade-in">
      <button class="close-modal" onclick="closeCheckoutModal()">&times;</button>
      <h2 style="margin-bottom: 1.5rem; color: var(--accent-red);">Sipariş Detayları</h2>
      <form id="checkout-form" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label for="companyName">Firma Adı</label>
          <input type="text" id="companyName" class="form-control" required placeholder="İkies Elektronik A.Ş.">
        </div>
        <div class="form-group">
          <label for="contactName">Yetkili Adı Soyadı</label>
          <input type="text" id="contactName" class="form-control" required placeholder="Ad Soyad">
        </div>
        <div class="form-group">
          <label for="email">E-posta Adresi</label>
          <input type="email" id="email" class="form-control" required placeholder="ornek@firma.com">
        </div>
        <div class="form-group">
          <label for="phone">Telefon Numarası</label>
          <input type="tel" id="phone" class="form-control" required placeholder="0532 123 45 67">
        </div>
        
        <div class="anti-spam-container">
          <span style="color: var(--text-light);">Güvenlik Doğrulaması:</span>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span id="spam-question" style="font-weight: bold; font-size: 1.2rem; color: var(--accent-red);"></span>
            <input type="number" id="spam-answer" class="form-control" style="width: 80px;" placeholder="Sonuç" required>
          </div>
        </div>
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; background: var(--accent-red);">Siparişi Gönder</button>
      </form>
    </div>
  </div>

  <footer style="text-align: center; padding: 2rem 0; border-top: 1px solid var(--border-color); margin-top: 4rem;">
    <p style="color: var(--text-muted);">&copy; 2026 İkies Elektronik. Tüm hakları saklıdır.</p>
  </footer>
  <script src="js/app.js?v=2"></script>
  <script>
    let expectedSpamAnswer = 0;

    function generateSpamQuestion() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      expectedSpamAnswer = num1 + num2;
      document.getElementById('spam-question').innerText = `${num1} + ${num2} = ?`;
      document.getElementById('spam-answer').value = '';
    }

    function openCheckoutModal() {
      if (window.cart.items.length === 0) {
        alert("Sepetiniz boş. Lütfen önce ürün ekleyin.");
        return;
      }
      generateSpamQuestion();
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').style.display = 'none';
      document.getElementById('checkout-form').reset();
    }

    function handleCheckout(e) {
      e.preventDefault();
      const userAnswer = parseInt(document.getElementById('spam-answer').value);
      if (userAnswer !== expectedSpamAnswer) {
        alert("Güvenlik sorusunu yanlış cevapladınız. Lütfen tekrar deneyin.");
        generateSpamQuestion();
        return;
      }
      
      // In a real app, this would send an API request or email.
      alert("Siparişiniz başarıyla alınmıştır! Firma bilgilerinizle en kısa sürede iletişime geçilecektir.");
      window.cart.clearCart();
      closeCheckoutModal();
    }

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const items = window.cart.items;
      const completeBtn = document.getElementById('complete-order-btn');
      
      if (items.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">Sepetiniz boş.</p>';
        if (completeBtn) {
           completeBtn.style.background = 'var(--text-muted)';
           completeBtn.style.color = '#111';
           completeBtn.style.cursor = 'not-allowed';
           completeBtn.onclick = () => alert("Sepetiniz boş.");
        }
        return;
      }

      if (completeBtn) {
         completeBtn.style.background = 'var(--accent-red)';
         completeBtn.style.color = '#fff';
         completeBtn.style.cursor = 'pointer';
         completeBtn.onclick = openCheckoutModal;
      }

      container.innerHTML = '';
      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div>
            <h3 style="margin-bottom: 0.5rem;">${item.name}</h3>
            <p style="color: var(--text-muted);">Miktar: ${item.quantity}</p>
          </div>
          <button class="btn" style="background: #333;" onclick="window.cart.removeItem(${index})">Kaldır</button>
        `;
        container.appendChild(div);
      });
    }
    
    document.addEventListener('DOMContentLoaded', renderCart);
    window.addEventListener('cartUpdated', renderCart);
  </script>
</body>
</html>
