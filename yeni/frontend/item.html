<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün Detayı | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .item-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      margin-top: 2rem;
      align-items: start;
    }
    @media (max-width: 768px) {
      .item-detail-container {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    /* ── Product Photo Gallery (Task 1) ── */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
    }

    .main-image-wrapper {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s ease-in-out;
    }

    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      transition: all 0.2s;
      user-select: none;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .gallery-nav-btn:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      transform: translateY(-50%) scale(1.08);
    }

    .gallery-nav-btn.prev { left: 12px; }
    .gallery-nav-btn.next { right: 12px; }

    .gallery-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 2;
    }

    .thumbnails-strip {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding: 4px 2px 8px 2px;
      scrollbar-width: thin;
    }

    .thumbnails-strip::-webkit-scrollbar {
      height: 4px;
    }

    .thumbnails-strip::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .thumb-item {
      width: 72px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #222;
      background: #111;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .thumb-item:hover {
      opacity: 0.95;
      border-color: #555;
    }

    .thumb-item.active {
      opacity: 1;
      border-color: var(--accent-red);
      box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Product Info ── */
    .item-title {
      font-size: 2.5rem;
      color: var(--text-main);
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    .item-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <nav class="navbar animate-fade-in">
    <div class="logo-container">
      <a href="index.html" class="logo-text">İkies Elektronik</a>
    </div>
    <button class="menu-toggle">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Anasayfa</a></li>
      <li><a href="projects.html">Ürünler & Projeler</a></li>
      <li><a href="manuals.html">Kılavuzlar</a></li>
      <li><a href="references.html">Referanslar</a></li>
      <li><a href="cart.html" class="cart-nav-link">Sepet <span id="cart-badge" style="display:none;">0</span></a></li>
      <li><a href="admin-login.html" style="opacity: 0.6;">Yönetici Girişi</a></li>
    </ul>
  </nav>

  <div class="container animate-fade-in delay-100">
    <div id="item-container" class="item-detail-container">
      <p style="color: var(--text-muted);">Ürün yükleniyor...</p>
    </div>
  </div>

  <footer style="text-align: center; padding: 2rem 0; border-top: 1px solid var(--border-color); margin-top: 4rem;">
    <p style="color: var(--text-muted);">&copy; 2026 İkies Elektronik. Tüm hakları saklıdır.</p>
  </footer>

  <script src="js/app.js?v=5"></script>
  <script>
    let currentImageIndex = 0;
    let productImages = [];

    function switchImage(index) {
      if (productImages.length === 0) return;
      currentImageIndex = (index + productImages.length) % productImages.length;

      const mainImg = document.getElementById('main-gallery-img');
      const counter = document.getElementById('gallery-counter');
      if (mainImg) {
        mainImg.style.opacity = '0.3';
        setTimeout(() => {
          mainImg.src = productImages[currentImageIndex];
          mainImg.style.opacity = '1';
        }, 120);
      }
      if (counter) {
        counter.textContent = `${currentImageIndex + 1} / ${productImages.length}`;
      }

      // Update thumbnail active states
      const thumbs = document.querySelectorAll('.thumb-item');
      thumbs.forEach((thumb, idx) => {
        if (idx === currentImageIndex) {
          thumb.classList.add('active');
          thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          thumb.classList.remove('active');
        }
      });
    }

    async function loadItemDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const container = document.getElementById('item-container');
      
      if (!id) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center;">
            <p style="color: var(--accent-red); margin-bottom: 1rem;">Geçersiz ürün seçimi.</p>
            <a href="projects.html" class="btn">&larr; Ürünler Listesine Dön</a>
          </div>
        `;
        return;
      }
      
      try {
        const product = await window.ProductService.getById(id);
        if (!product) throw new Error('Not found');
        
        document.title = `${product.name} | İkies Elektronik`;

        // Gather all photos for this product (max 20)
        productImages = [];
        const hasRealPrimary = product.image_url && product.image_url !== 'images/placeholder.svg';
        if (hasRealPrimary) {
          productImages.push(product.image_url);
        }
        if (Array.isArray(product.images)) {
          product.images.forEach(img => {
            const url = typeof img === 'string' ? img : img.image_url;
            if (url && !productImages.includes(url) && productImages.length < 20) {
              productImages.push(url);
            }
          });
        }
        if (productImages.length === 0) {
          productImages.push('images/placeholder.svg');
        }

        const manualButtonHtml = product.manual_url 
          ? `<button class="btn" id="manual-btn" style="background: var(--text-muted); color: #111;">Teknik Kılavuzu İndir</button>` 
          : '';

        // Build Gallery HTML
        let galleryHtml = '';
        if (productImages.length > 1) {
          let thumbsHtml = '';
          productImages.forEach((url, idx) => {
            thumbsHtml += `
              <div class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="switchImage(${idx})">
                <img src="${url}" class="thumb-img" alt="Küçük resim ${idx + 1}" onerror="this.src='images/placeholder.svg'">
              </div>
            `;
          });

          galleryHtml = `
            <div class="gallery-container">
              <div class="main-image-wrapper">
                <img id="main-gallery-img" src="${productImages[0]}" alt="${product.name}" class="main-gallery-img" onerror="this.src='images/placeholder.svg'">
                <button class="gallery-nav-btn prev" onclick="switchImage(currentImageIndex - 1)" title="Önceki resim">&#10094;</button>
                <button class="gallery-nav-btn next" onclick="switchImage(currentImageIndex + 1)" title="Sonraki resim">&#10095;</button>
                <div class="gallery-counter" id="gallery-counter">1 / ${productImages.length}</div>
              </div>
              <div class="thumbnails-strip">
                ${thumbsHtml}
              </div>
            </div>
          `;
        } else {
          // Single image layout
          galleryHtml = `
            <div class="gallery-container">
              <div class="main-image-wrapper">
                <img id="main-gallery-img" src="${productImages[0]}" alt="${product.name}" class="main-gallery-img" onerror="this.src='images/placeholder.svg'">
              </div>
            </div>
          `;
        }

        container.innerHTML = `
          ${galleryHtml}
          <div>
            <h1 class="item-title">${product.name}</h1>
            <p class="item-desc">${product.description}</p>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
              <input type="number" id="qty-input" value="1" min="1" style="width: 80px; padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border-color); background: #111; color: #fff;">
              <button class="btn" onclick="window.cart.addItem('${product.name.replace(/'/g, "\\'")}', document.getElementById('qty-input').value)">Sepete Ekle</button>
              ${manualButtonHtml}
            </div>
            <div style="margin-top: 1.5rem;">
              <a href="projects.html" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: none;">&larr; Tüm Ürünlere Geri Dön</a>
            </div>
          </div>
        `;

        const mBtn = document.getElementById('manual-btn');
        if (mBtn && product.manual_url) {
          mBtn.addEventListener('click', () => {
            if (window.downloadManualFile) {
              window.downloadManualFile(product.manual_url, product.name);
            } else {
              window.open(product.manual_url, '_blank');
            }
          });
        }
      } catch(e) {
        console.error("Item detail load error:", e);
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center;">
            <p style="color: var(--accent-red); margin-bottom: 1rem;">Ürün bulunamadı.</p>
            <a href="projects.html" class="btn">&larr; Ürünler Listesine Dön</a>
          </div>
        `;
      }
    }

    // Keyboard navigation for image carousel (Arrow keys)
    document.addEventListener('keydown', (e) => {
      if (productImages && productImages.length > 1) {
        if (e.key === 'ArrowLeft') switchImage(currentImageIndex - 1);
        if (e.key === 'ArrowRight') switchImage(currentImageIndex + 1);
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadItemDetail);
    } else {
      loadItemDetail();
    }
  </script>
</body>
</html>
