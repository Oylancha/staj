<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün Detayı | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=4">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('ikies_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  <style>
    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: hsl(var(--muted-foreground));
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .breadcrumb a:hover {
      color: hsl(var(--foreground));
    }
    .breadcrumb-sep {
      color: hsl(var(--border));
    }
    .breadcrumb-current {
      color: hsl(var(--foreground));
      font-weight: 500;
    }

    .item-detail-container {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 3.5rem;
      align-items: start;
    }
    .item-detail-container > * {
      min-width: 0;
      max-width: 100%;
    }
    @media (max-width: 860px) {
      .item-detail-container {
        grid-template-columns: 1fr !important;
        gap: 2rem;
      }
    }

    /* ── Product Photo Gallery ── */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    .main-image-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      aspect-ratio: 4 / 3;
      max-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .main-gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: opacity 0.15s ease-in-out, transform 0.25s ease;
    }

    .main-image-wrapper:hover .main-gallery-img {
      transform: scale(1.02);
    }

    .gallery-zoom-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: hsla(var(--background), 0.85);
      color: hsl(var(--foreground));
      border: 1px solid hsl(var(--border));
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 3;
      transition: all var(--transition-speed) ease;
      opacity: 0.9;
    }

    .gallery-zoom-badge:hover {
      opacity: 1;
      background: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: #fff;
      transform: scale(1.08);
    }

    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: hsla(var(--background), 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: hsl(var(--foreground));
      border: 1px solid hsl(var(--border));
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all var(--transition-speed) ease;
      user-select: none;
      z-index: 3;
    }

    .gallery-nav-btn:hover {
      background: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: #fff;
      transform: translateY(-50%) scale(1.08);
    }

    .gallery-nav-btn.prev { left: 12px; }
    .gallery-nav-btn.next { right: 12px; }

    .gallery-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: hsla(var(--background), 0.85);
      color: hsl(var(--foreground));
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid hsl(var(--border));
      z-index: 3;
      user-select: none;
    }

    .thumbnails-strip {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 4px 2px 8px 2px;
      scrollbar-width: thin;
      scrollbar-color: hsl(var(--primary)) hsla(var(--muted), 0.3);
      -webkit-overflow-scrolling: touch;
    }

    .thumbnails-strip::-webkit-scrollbar {
      height: 6px;
    }
    .thumbnails-strip::-webkit-scrollbar-track {
      background: hsla(var(--muted), 0.3);
      border-radius: 9999px;
    }
    .thumbnails-strip::-webkit-scrollbar-thumb {
      background: hsl(var(--border));
      border-radius: 9999px;
    }
    .thumbnails-strip::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--primary));
    }

    .thumb-item {
      width: 72px;
      height: 54px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--muted));
      cursor: pointer;
      opacity: 0.6;
      transition: all var(--transition-speed) ease;
    }

    .thumb-item:hover {
      opacity: 0.95;
      border-color: hsl(var(--muted-foreground));
    }

    .thumb-item.active {
      opacity: 1;
      border-color: hsl(var(--primary));
      box-shadow: 0 0 0 2px hsl(var(--primary) / 0.35);
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Photo Lightbox Modal (Same style as reference companies) ── */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease-out;
      padding: 1.5rem;
    }

    .lightbox-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius-md);
      border: 1px solid hsl(var(--border));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transition: opacity 0.15s ease-in-out;
      user-select: none;
    }

    .lightbox-close {
      position: absolute;
      top: -44px;
      right: 0;
      background: hsla(0, 0%, 20%, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      z-index: 2010;
    }

    .lightbox-close:hover {
      background: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: #fff;
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: hsla(0, 0%, 20%, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      transition: all 0.15s ease;
      user-select: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2010;
    }

    .lightbox-nav-btn:hover {
      background: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: #fff;
      transform: translateY(-50%) scale(1.08);
    }

    .lightbox-nav-btn.prev {
      left: -60px;
    }

    .lightbox-nav-btn.next {
      right: -60px;
    }

    @media (max-width: 768px) {
      .lightbox-nav-btn.prev { left: 8px; }
      .lightbox-nav-btn.next { right: 8px; }
      .lightbox-close { top: -40px; right: 0; }
    }

    .lightbox-counter {
      margin-top: 0.75rem;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* ── Product Info & Actions ── */
    .item-title {
      font-size: 2.25rem;
      color: hsl(var(--foreground));
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }
    .item-desc {
      font-size: 1rem;
      color: hsl(var(--muted-foreground));
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .purchase-panel {
      background-color: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
    }

    .item-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .qty-action-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex: 1;
    }

    .qty-input {
      width: 80px;
      height: 2.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid hsl(var(--input));
      background: transparent;
      color: hsl(var(--foreground));
      text-align: center;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .qty-input:focus {
      outline: none;
      border-color: hsl(var(--ring));
      box-shadow: 0 0 0 1px hsl(var(--ring));
    }

    @media (max-width: 768px) {
      .item-main-container {
        width: 86% !important;
        max-width: 440px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-top: 1.25rem !important;
        padding-bottom: 5rem !important;
      }
      .item-detail-container {
        grid-template-columns: 1fr !important;
        gap: 1.5rem !important;
      }
      .main-image-wrapper {
        aspect-ratio: 16 / 11 !important;
        border-radius: var(--radius-xl) !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4) !important;
      }
      .thumbnails-strip {
        gap: 0.4rem !important;
        padding: 4px 0 !important;
      }
      .thumb-item {
        width: 60px !important;
        height: 45px !important;
        border-radius: var(--radius-sm) !important;
      }
      .item-title {
        font-size: 1.45rem !important;
        line-height: 1.25 !important;
        margin-bottom: 0.5rem !important;
      }
      .item-desc {
        font-size: 0.9rem !important;
        line-height: 1.6 !important;
        margin-bottom: 1.25rem !important;
      }
      .purchase-panel {
        padding: 1.25rem !important;
        border-radius: var(--radius-lg) !important;
      }
      .breadcrumb {
        font-size: 0.8rem !important;
        margin-bottom: 1rem !important;
        gap: 0.35rem !important;
      }
      .item-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .qty-action-row {
        width: 100%;
      }
      .qty-input {
        width: 70px !important;
        height: 2.5rem !important;
      }
      .btn-add-cart {
        flex: 1;
      }
      .item-actions .btn {
        width: 100%;
      }
      .back-btn-box {
        margin-top: 2rem !important;
        margin-bottom: 2.5rem !important;
      }
    }
  </style>
</head>
<body>
  
  <header class="navbar">
    <div class="logo-container">
      <a href="index.html" class="logo-text">
        <img src="images/logo.png" alt="İkies Elektronik Logo" class="logo-img">
        <span>İkies Elektronik</span>
      </a>
    </div>
    <div class="nav-right">
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Anasayfa</a></li>
          <li><a href="projects.html" class="active">Ürünler & Projeler</a></li>
          <li><a href="manuals.html">Kılavuzlar</a></li>
          <li><a href="references.html">Referanslar</a></li>
          <li><a href="cart.html" class="cart-nav-link">Sepet <span id="cart-badge">0</span></a></li>
          <li><a href="admin-login.html" class="btn btn-outline btn-sm" style="margin-left: 0.5rem;">Yönetici Girişi</a></li>

      <button class="theme-toggle-btn" aria-label="Temayı Değiştir" title="Açık/Koyu Tema">
        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="menu-toggle" aria-label="Menüyü Aç/Kapat">&#9776;</button>

  </header>

  <main class="container item-main-container animate-fade-in delay-100" style="padding-top: 2.5rem; padding-bottom: 4rem;">
    <nav class="breadcrumb">
      <a href="index.html">Anasayfa</a>
      <span class="breadcrumb-sep">/</span>
      <a href="projects.html">Ürünler & Projeler</a>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current" id="crumb-product-name">Ürün</span>
    </nav>

    <div id="item-container" class="item-detail-container">
      <p class="text-muted">Ürün yükleniyor...</p>
    </div>
  </main>

  <!-- Photo Lightbox Modal (Same as reference companies window) -->
  <div class="lightbox-overlay" id="photo-lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox(event)" title="Kapat">&times;</button>
      <button class="lightbox-nav-btn prev" id="lb-prev-btn" onclick="switchLightboxImage(-1, event)" title="Önceki resim (Sol Ok)" aria-label="Önceki resim">&#10094;</button>
      <img id="lightbox-image" class="lightbox-img" src="" alt="Resim Önizleme">
      <button class="lightbox-nav-btn next" id="lb-next-btn" onclick="switchLightboxImage(1, event)" title="Sonraki resim (Sağ Ok)" aria-label="Sonraki resim">&#10095;</button>
      <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
    </div>
  </div>

  <footer class="footer">
    <p class="footer-text">© 2026 İkies Elektronik. Tüm Hakları Saklıdır.</p>
  </footer>

  <script src="js/app.js?v=8"></script>
  <script>
    let currentImageIndex = 0;
    let productImages = [];

    function switchImage(index) {
      if (!productImages || productImages.length === 0) return;
      currentImageIndex = (index + productImages.length) % productImages.length;

      const mainImg = document.getElementById('main-gallery-img');
      const counter = document.getElementById('gallery-counter');
      if (mainImg) {
        mainImg.style.opacity = '0.35';
        setTimeout(() => {
          mainImg.src = productImages[currentImageIndex];
          mainImg.style.opacity = '1';
        }, 80);
      }
      if (counter) {
        counter.textContent = `${currentImageIndex + 1} / ${productImages.length}`;
      }

      const thumbs = document.querySelectorAll('.thumb-item');
      thumbs.forEach((thumb, idx) => {
        if (idx === currentImageIndex) {
          thumb.classList.add('active');
          thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          thumb.classList.remove('active');
        }
      });

      // Synchronize Lightbox if it is currently open
      const lb = document.getElementById('photo-lightbox');
      if (lb && lb.classList.contains('active')) {
        const lbImg = document.getElementById('lightbox-image');
        const lbCounter = document.getElementById('lightbox-counter');
        if (lbImg) {
          lbImg.style.opacity = '0.35';
          lbImg.src = productImages[currentImageIndex];
          setTimeout(() => {
            lbImg.style.opacity = '1';
          }, 50);
        }
        if (lbCounter) {
          lbCounter.textContent = `${currentImageIndex + 1} / ${productImages.length}`;
        }
      }
    }

    function openLightbox(index) {
      if (!productImages || productImages.length === 0) return;
      if (typeof index === 'number') {
        switchImage(index);
      }
      const lb = document.getElementById('photo-lightbox');
      const lbImg = document.getElementById('lightbox-image');
      const lbPrev = document.getElementById('lb-prev-btn');
      const lbNext = document.getElementById('lb-next-btn');
      const lbCounter = document.getElementById('lightbox-counter');
      const total = productImages.length;

      if (lbImg) {
        lbImg.src = productImages[currentImageIndex];
      }
      if (lbCounter) {
        lbCounter.textContent = `${currentImageIndex + 1} / ${total}`;
        lbCounter.style.display = total > 1 ? 'block' : 'none';
      }
      if (lbPrev) lbPrev.style.display = total > 1 ? 'flex' : 'none';
      if (lbNext) lbNext.style.display = total > 1 ? 'flex' : 'none';

      if (lb) lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function switchLightboxImage(direction, e) {
      if (e && e.stopPropagation) e.stopPropagation();
      switchImage(currentImageIndex + direction);
    }

    function closeLightbox(e) {
      if (e && e.target && (e.target.id === 'lightbox-image' || e.target.closest('.lightbox-nav-btn'))) {
        return;
      }
      const lb = document.getElementById('photo-lightbox');
      if (lb) lb.classList.remove('active');
      const lbImg = document.getElementById('lightbox-image');
      if (lbImg) lbImg.src = '';
      document.body.style.overflow = '';
    }

    async function loadItemDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const container = document.getElementById('item-container');
      
      if (!id) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 0;">
            <p style="color: hsl(var(--primary)); margin-bottom: 1rem;">Geçerli bir ürün kimliği belirtilmedi.</p>
            <a href="projects.html" class="btn btn-outline">&larr; Ürünler Listesine Dön</a>
          </div>
        `;
        return;
      }

      try {
        const product = await window.ProductService.getById(id);

        if (!product) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 0;">
              <p style="color: hsl(var(--primary)); margin-bottom: 1rem;">Ürün bulunamadı.</p>
              <a href="projects.html" class="btn btn-outline">&larr; Ürünler Listesine Dön</a>
            </div>
          `;
          return;
        }

        // Set page title and breadcrumb
        document.title = `${product.name} | İkies Elektronik`;
        const crumbName = document.getElementById('crumb-product-name');
        if (crumbName) crumbName.textContent = product.name;

        // Collect images
        productImages = [];
        if (product.image_url && product.image_url !== 'images/placeholder.svg') {
          productImages.push(product.image_url);
        }
        if (Array.isArray(product.images)) {
          product.images.forEach(img => {
            const url = typeof img === 'string' ? img : (img && img.image_url ? img.image_url : null);
            if (url && !productImages.includes(url)) {
              productImages.push(url);
            }
          });
        }
        if (productImages.length === 0) {
          productImages.push(product.image_url || 'images/placeholder.svg');
        }

        currentImageIndex = 0;

        let manualButtonHtml = '';
        if (product.manual_url) {
          manualButtonHtml = `
            <button id="manual-btn" class="btn btn-outline" style="gap: 0.5rem; height: 2.5rem;" title="Teknik dokümanı görüntüleyin">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Teknik Kılavuz (PDF)
            </button>
          `;
        }

        const isMulti = productImages.length > 1;
        let galleryHtml = '';

        if (isMulti) {
          const thumbsHtml = productImages.map((img, idx) => `
            <div class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="switchImage(${idx})">
              <img src="${img}" alt="${product.name} thumbnail ${idx + 1}" class="thumb-img" onerror="this.src='images/placeholder.svg'">
            </div>
          `).join('');

          galleryHtml = `
            <div class="gallery-container">
              <div class="main-image-wrapper" onclick="openLightbox(currentImageIndex)" title="Resmi büyütmek için tıklayınız">
                <img id="main-gallery-img" src="${productImages[0]}" alt="${product.name}" class="main-gallery-img" onerror="this.src='images/placeholder.svg'">
                <button class="gallery-zoom-badge" onclick="event.stopPropagation(); openLightbox(currentImageIndex);" title="Resmi Büyüt (Lightbox)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </button>
                <button class="gallery-nav-btn prev" onclick="event.stopPropagation(); switchImage(currentImageIndex - 1);" title="Önceki resim">&#10094;</button>
                <button class="gallery-nav-btn next" onclick="event.stopPropagation(); switchImage(currentImageIndex + 1);" title="Sonraki resim">&#10095;</button>
                <div class="gallery-counter" id="gallery-counter">1 / ${productImages.length}</div>
              </div>
              <div class="thumbnails-strip">
                ${thumbsHtml}
              </div>
            </div>
          `;
        } else {
          galleryHtml = `
            <div class="gallery-container">
              <div class="main-image-wrapper" onclick="openLightbox(0)" title="Resmi büyütmek için tıklayınız">
                <img id="main-gallery-img" src="${productImages[0]}" alt="${product.name}" class="main-gallery-img" onerror="this.src='images/placeholder.svg'">
                <button class="gallery-zoom-badge" onclick="event.stopPropagation(); openLightbox(0);" title="Resmi Büyüt (Lightbox)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </button>
              </div>
            </div>
          `;
        }

        const badgeType = product.parent_id 
          ? '<span class="badge badge-outline">Alt Modül</span>' 
          : '<span class="badge badge-secondary">Ana Sistem Çözümü</span>';

        container.innerHTML = `
          ${galleryHtml}
          <div>
            <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem;">
              ${badgeType}
              <span class="badge badge-secondary">Endüstriyel Kalite</span>
            </div>
            <h1 class="item-title tracking-tight">${product.name}</h1>
            <p class="item-desc">${product.description}</p>
            
            <div class="purchase-panel">
              <div style="font-size: 0.8125rem; font-weight: 500; color: hsl(var(--muted-foreground)); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
                Sipariş / Teklif Talebi
              </div>
              <div class="item-actions">
                <div class="qty-action-row">
                  <input type="number" id="qty-input" class="qty-input" value="1" min="1" aria-label="Miktar">
                  <button class="btn btn-primary btn-add-cart" style="height: 2.5rem;" onclick="window.cart.addItem('${product.name.replace(/'/g, "\\'")}', document.getElementById('qty-input').value)">
                    Sepete Ekle
                  </button>
                </div>
                ${manualButtonHtml}
              </div>
            </div>

            <div class="back-btn-box" style="margin-top: 1.5rem; margin-bottom: 2rem;">
              <a href="projects.html" class="btn btn-ghost btn-sm" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: var(--radius-md);">
                &larr; Tüm Ürünlere Geri Dön
              </a>
            </div>
          </div>
        `;

        const wrapper = container.querySelector('.main-image-wrapper');
        if (wrapper && productImages && productImages.length > 1) {
          attachSwipeListener(wrapper, () => switchImage(currentImageIndex + 1), () => switchImage(currentImageIndex - 1));
        }

        const lbContent = document.querySelector('.lightbox-content');
        if (lbContent) {
          attachSwipeListener(lbContent, () => switchLightboxImage(1), () => switchLightboxImage(-1));
        }

        const mBtn = document.getElementById('manual-btn');
        if (mBtn && product.manual_url) {
          mBtn.addEventListener('click', () => {
            if (window.downloadManualFile) {
              window.downloadManualFile(product.manual_url, product.name);
            } else {
              window.open(product.manual_url, '_blank');
            }
          });
        }
      } catch(e) {
        console.error("Item detail load error:", e);
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 0;">
            <p style="color: hsl(var(--primary)); margin-bottom: 1rem;">Ürün yüklenirken bir hata oluştu.</p>
            <a href="projects.html" class="btn btn-outline">&larr; Ürünler Listesine Dön</a>
          </div>
        `;
      }
    }

    function attachSwipeListener(element, onSwipeLeft, onSwipeRight) {
      if (!element) return;
      let startX = 0;
      let startY = 0;
      element.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }
      }, { passive: true });

      element.addEventListener('touchend', (e) => {
        if (e.changedTouches && e.changedTouches.length === 1) {
          const deltaX = e.changedTouches[0].clientX - startX;
          const deltaY = e.changedTouches[0].clientY - startY;
          if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
            if (deltaX < 0) {
              onSwipeLeft();
            } else {
              onSwipeRight();
            }
          }
        }
      }, { passive: true });
    }

    document.addEventListener('keydown', (e) => {
      const lb = document.getElementById('photo-lightbox');
      const isLbActive = lb && lb.classList.contains('active');

      if (e.key === 'Escape') {
        if (isLbActive) {
          closeLightbox();
        }
      } else if (e.key === 'ArrowLeft') {
        if (productImages && productImages.length > 1) {
          e.preventDefault();
          if (isLbActive) {
            switchLightboxImage(-1, e);
          } else {
            switchImage(currentImageIndex - 1);
          }
        }
      } else if (e.key === 'ArrowRight') {
        if (productImages && productImages.length > 1) {
          e.preventDefault();
          if (isLbActive) {
            switchLightboxImage(1, e);
          } else {
            switchImage(currentImageIndex + 1);
          }
        }
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadItemDetail);
    } else {
      loadItemDetail();
    }
  </script>
</body>
</html>
