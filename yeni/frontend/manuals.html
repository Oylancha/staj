<!DOCTYPE html>
<html lang="tr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teknik Kılavuzlar | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css?v=2" />
  <link rel="stylesheet" href="css/components.css?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .manuals-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .manuals-header h1 {
      font-size: 3rem;
      color: var(--accent-red);
    }
    .manuals-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Manuals List */
    .manuals-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .manual-item {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem 1.5rem;
      transition: transform var(--transition-speed) ease, 
                  box-shadow var(--transition-speed) ease,
                  border-color var(--transition-speed) ease;
    }

    .manual-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-color: var(--accent-red);
    }

    .manual-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: #111;
      border: 1px solid var(--border-color);
    }

    .manual-info {
      flex: 1;
      min-width: 0;
    }

    .manual-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0 0.2rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manual-format {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .manual-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition-speed) ease, transform 0.2s ease;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .manual-download-btn:hover {
      background: var(--accent-red-hover);
      transform: translateY(-2px);
      color: #fff;
    }

    .manual-download-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .manuals-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 4rem 1rem;
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      .manual-item {
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 1rem;
      }
      .manual-info {
        flex: 1 1 calc(100% - 72px);
      }
      .manual-download-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar animate-fade-in">
    <div class="logo-container">
      <a href="index.html" class="logo-text">İkies Elektronik</a>
    </div>
    <button class="menu-toggle">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Anasayfa</a></li>
      <li><a href="projects.html">Ürünler & Projeler</a></li>
      <li><a href="manuals.html">Kılavuzlar</a></li>
      <li><a href="references.html">Referanslar</a></li>
      <li><a href="cart.html" class="cart-nav-link">Sepet <span id="cart-badge" style="display:none;">0</span></a></li>
      <li><a href="admin-login.html" style="opacity: 0.6;">Yönetici Girişi</a></li>
    </ul>
  </nav>

  <div class="container animate-fade-in delay-100">
    <div class="manuals-header">
      <h1>Teknik Kılavuzlar</h1>
      <p>Ürünlerimize ait tüm teknik dokümanları buradan indirebilirsiniz</p>
    </div>

    <div class="manuals-list" id="manuals-list">
      <p class="manuals-empty">Kılavuzlar yükleniyor...</p>
    </div>
  </div>

  <footer class="footer">
    <p class="footer-text">© 2026 İkies Elektronik. Tüm Hakları Saklıdır.</p>
  </footer>

  <script src="js/app.js?v=3"></script>
  <script>
    async function loadManuals() {
      const list = document.getElementById('manuals-list');
      try {
        const products = await window.ProductService.getAll();

        // Filter only products that have a manual_url
        const withManuals = products.filter(p => p.manual_url && p.manual_url.trim() !== '');

        if (withManuals.length === 0) {
          list.innerHTML = '<p class="manuals-empty">Henüz hiç teknik kılavuz eklenmemiş.</p>';
          return;
        }

        list.innerHTML = '';

        withManuals.forEach((p, index) => {
          const item = document.createElement('div');
          item.className = 'manual-item animate-fade-in';
          item.style.animationDelay = `${index * 0.06}s`;

          const imgSrc = p.image_url || 'images/placeholder.svg';
          const manualUrl = p.manual_url;
          const fileInfo = window.getManualFileInfo ? window.getManualFileInfo(manualUrl, p.name) : { label: 'PDF', fileName: `${p.name}.pdf` };

          item.innerHTML = `
            <img src="${imgSrc}" alt="${p.name}" class="manual-thumb" onerror="this.onerror=null;this.src='images/placeholder.svg';">
            <div class="manual-info">
              <p class="manual-name">${p.name}</p>
              <span class="manual-format">${fileInfo.label} Dosyası</span>
            </div>
            <button class="manual-download-btn" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 4h14v-2H5v2z"/></svg>
              İndir
            </button>
          `;

          const btn = item.querySelector('.manual-download-btn');
          btn.addEventListener('click', () => {
            if (window.downloadManualFile) {
              window.downloadManualFile(manualUrl, p.name);
            } else {
              window.open(manualUrl, '_blank');
            }
          });

          list.appendChild(item);
        });

      } catch (err) {
        console.error('Failed to load manuals:', err);
        list.innerHTML = '<p class="manuals-empty" style="color: var(--accent-red);">Kılavuzlar yüklenirken bir hata oluştu.</p>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadManuals);
    } else {
      loadManuals();
    }
  </script>
</body>
</html>
