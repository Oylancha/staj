<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeler & Ürünler | İkies Elektronik</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <nav class="navbar">
    <div class="logo-container">
      <a href="index.html" class="logo-text">İkies Elektronik</a>
    </div>
    <button class="menu-toggle">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Anasayfa</a></li>
      <li><a href="about.html">Hakkımızda</a></li>
      <li><a href="projects.html">Ürünler & Projeler</a></li>
      <li><a href="references.html">Referanslar</a></li>
      <li><a href="contact.html">İletişim</a></li>
      <li><a href="cart.html" class="cart-nav-link">Sepet <span id="cart-badge" style="display:none;">0</span></a></li>
    </ul>
  </nav>

  <div class="container animate-fade-in delay-100">
    <div style="text-align: center; margin-bottom: 3rem;">
      <h1 style="font-size: 3rem; color: var(--accent-red);">Tüm Ürünler ve Projeler</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem;">Katalogumuzdaki Tüm Akıllı Sistemler ve Çözümler</p>
    </div>

    <div class="card-grid" id="dynamic-products-grid">
      <p style="text-align: center; color: var(--text-muted); width: 100%;">Ürünler yükleniyor...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('dynamic-products-grid');
      try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error('Network response was not ok');
        const products = await res.json();
        
        if (products.length === 0) {
          grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); width: 100%;">Henüz hiç ürün eklenmemiş.</p>';
          return;
        }

        grid.innerHTML = ''; // Clear loading text
        
        products.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          const shortDesc = p.description.length > 100 ? p.description.substring(0, 100) + '...' : p.description;
          
          card.innerHTML = `
            <div class="card-img-container">
              <img src="${p.image_url}" alt="${p.name}" class="card-img" onerror="this.src='images/placeholder.jpg'">
            </div>
            <div class="card-content">
              <h3 class="card-title">${p.name}</h3>
              <p class="card-desc">${shortDesc}</p>
              <div class="card-action">
                <a href="item.html?id=${p.id}" class="btn">Detayları İncele</a>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="text-align: center; color: var(--accent-red); width: 100%;">Ürünler yüklenirken bir hata oluştu.</p>';
      }
    });
  </script>

  <footer class="footer">
    <p class="footer-text">© 2026 İkies Elektronik. Tüm Hakları Saklıdır. | <a href="admin-login.html" style="color: var(--text-muted); opacity: 0.5;">Yönetici Girişi</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
